services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      APP_DEMO_MODE: "true"
      APP_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK_DATA: "false"
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
